{% extends 'base_portal.html' %}

{% block content %}
    <h2>{% if object %}Editar personal{% else %}Novo personal{% endif %}</h2>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-row">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <small style="color: #dc2626;">{{ field.errors|join:', ' }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <div class="button-group">
            <button type="submit">Salvar</button>
            <a class="button-link" href="{% url 'personal_list' %}">Voltar</a>
        </div>
    </form>
{% endblock %}
