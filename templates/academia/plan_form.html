{% extends 'base.html' %}

{% block content %}
    <h2>{% if object %}Editar plano{% else %}Cadastrar plano{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <label for="id_name">Nome do plano</label>
            {{ form.name }}
        </div>
        <div class="form-row">
            <label for="id_price">Preço</label>
            {{ form.price }}
        </div>
        <div class="form-row">
            <label for="id_duration_days">Duração (dias)</label>
            {{ form.duration_days }}
        </div>
        <div class="button-group">
            <button type="submit">Salvar</button>
            <a class="button-link" href="{% url 'plan_list' %}">Cancelar</a>
        </div>
    </form>
{% endblock %}
