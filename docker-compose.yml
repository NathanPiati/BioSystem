services:
  biosystem:
    build: .
    container_name: biosystem
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    command: >
            sh -c "python manage.py migrate --noinput &&
              python manage.py collectstatic --noinput &&
             python -m gunicorn biosystem.wsgi:application
             --bind 0.0.0.0:8001 --workers 3 --timeout 120"

  postgres:
    image: postgres:16-alpine
    container_name: biosystem-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-AcademiaDB}
      POSTGRES_USER: ${DB_USER:-biosystem_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Inovatech2025@}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-biosystem_user} -d ${DB_NAME:-AcademiaDB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
